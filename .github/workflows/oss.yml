name: OSS (callable)
on:
  workflow_call:

env:
  PYTHON_VERSION: '3.12.8'

jobs:

  oss:
    name: Update OSS dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          # The commit further down is authored using the credentials from the checkout.
          # When running dependabot PRs, we need a more powerful token than the standard one 
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: extractions/netrc@v2
        with:
          machine: github.com
          username: pyansys-ci-bot
          password: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}

      - name: Install and analyze dependencies
        run: |
          echo "PR_NUMBER: $PR_NUMBER"
          echo "PR_URL: $PR_URL"

          uv sync --no-dev
          uv run --no-sync dump_dependencies.py
        working-directory: oss
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}

      - name: Create dependency tree
        run: |
          uv pip tree
          uv pip tree > dependency_tree.txt
        working-directory: oss
      
      - name: Commit changes
        if: github.ref != 'refs/heads/main' && !contains(github.ref, 'refs/tags')
        uses: EndBug/add-and-commit@v9
        with:
          add: oss/dependencies.json oss/legal_notices.txt oss/dependency_tree.txt
          default_author: github_actions
          message: 'Automatic update of OSS dependencies'

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dependencies
          path: |
            oss/dependencies.json
            oss/legal_notices.txt
            oss/dependency_tree.txt
