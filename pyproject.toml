[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "ansys-hdf5-composite-cae"
version = "0.1.dev0"
description = "A utility library for the hdf5 composite cae format"
license = "MIT"
authors = [{ name = "ANSYS, Inc."}]
requires-python = ">=3.10,<3.13"
maintainers = [{ name = "ANSYS, Inc."}]
readme = "README.md"
repository = "https://github.com/ansys-internal/hdf5-composite-cae"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy==2.2.6",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pre-commit==4.5.1",
]

oss = [
    "pip-licenses>=5.0.0",
]

doc = [
    "Sphinx>8.0.0",
    "numpydoc>1.5.0",
    "ansys-sphinx-theme>0.9.7",
    "sphinx-copybutton>0.5.1",
]


[tool.flit.module]
name = "ansys.hdf5_composite_cae"

[tool.ruff.lint]
select = [
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "UP",      # pyupgrade
    "A",       # flake8-builtins
    "C4",      # flake8-comprehensions
    "B",       # flake8-bugbear
    "PLE",     # Pylint errors
    "PLC",     # Pylint convention
    "PLW",     # Pylint warnings
    "PLR1711", # useless-return
    "PLR5501", # collapsible-else-if
    "Q",       # flake8-quotes
    "PT",      # flake8-pytest-style
    "LOG",     # flake8-logging
    "RET",     # flake8-return,
    "SIM",     # flake8-simplify,
]
ignore = ["E501", "A002"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PT011", "A"]


[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "[%(asctime)s | %(levelname)s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

filterwarnings = [
    "ignore::DeprecationWarning",
]
junit_family = "xunit2"