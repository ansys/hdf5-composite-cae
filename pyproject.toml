[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "ansys-hdf5-composite-cae"
version = "0.1.dev0"
description = "A utility library for the HDF5 composite CAE format"
license = "Apache-2.0"
authors = [{ name = "ANSYS, Inc."}]
requires-python = ">=3.12,<3.15"
maintainers = [{ name = "ANSYS, Inc."}]
readme = "README.rst"
classifiers = [
    "Development Status :: 5 - Production/Stable ",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=2.3.4",
    "h5py>=3.0"
]

[project.urls]
Repository = "https://github.com/ansys-internal/hdf5-composite-cae"

[dependency-groups]
tests = [
    "pytest==9.0.2",
    "pytest-cov",
]

dev = [
    "pre-commit==4.5.1",
]

doc = [
    "Sphinx>8.0.0",
    "numpydoc>1.5.0",
    "ansys-sphinx-theme>0.9.7",
    "sphinx-copybutton>0.5.1",
    "sphinx_gallery>=0.11.0",
    "sphinx-design>=0.3.0",
    "pdf2image>=1.17.0",
    "pillow>=12.1.0",
    "towncrier>=23.11.0",
]
[tool.uv]
default-groups = []

[tool.flit.module]
name = "ansys.hdf5_composite_cae"

[tool.flit.sdist]
include = ["src/ansys/hdf5_composite_cae/example_files/*"]

[project.scripts]
validate_composite_cae_h5 = "ansys.hdf5_composite_cae.cli:validate"
show_composite_cae_h5_examples = "ansys.hdf5_composite_cae.cli:show_examples"
create_minimal_file = "ansys.hdf5_composite_cae.cli:create_minimal_file"

[tool.ruff.lint]
select = [
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "UP",      # pyupgrade
    "A",       # flake8-builtins
    "C4",      # flake8-comprehensions
    "B",       # flake8-bugbear
    "PLE",     # Pylint errors
    "PLC",     # Pylint convention
    "PLW",     # Pylint warnings
    "PLR1711", # useless-return
    "PLR5501", # collapsible-else-if
    "Q",       # flake8-quotes
    "PT",      # flake8-pytest-style
    "LOG",     # flake8-logging
    "RET",     # flake8-return,
    "SIM",     # flake8-simplify,
]
ignore = ["E501", "A002"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PT011", "A"]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "[%(asctime)s | %(levelname)s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
addopts = "--cov=ansys.hdf5_composite_cae --cov-report=term --cov-report=xml --cov-report=html --cov-append"

filterwarnings = [
    "ignore::DeprecationWarning",
]
junit_family = "xunit2"

[tool.towncrier]
package = "ansys.hdf5_composite_cae"
directory = "doc/changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
underlines = ["", "", ""]
template = "doc/changelog.d/changelog_template.jinja"
title_format = "## [{version}](https://github.com/ansys/hdf5-composite-cae/releases/tag/v{version}) - {project_date}"
issue_format = "[#{issue}](https://github.com/ansys/hdf5-composite-cae/pull/{issue})"

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "documentation"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "dependencies"
name = "Dependencies"
showcontent = true

[[tool.towncrier.type]]
directory = "maintenance"
name = "Maintenance"
showcontent = true

[[tool.towncrier.type]]
directory = "miscellaneous"
name = "Miscellaneous"
showcontent = true
[[tool.towncrier.type]]
directory = "test"
name = "Test"
showcontent = true

