repos:

- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.11.13
  hooks:
    # Run the linter.
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format

- repo: https://github.com/codespell-project/codespell
  rev: v2.4.1
  hooks:
  - id: codespell
    args: [-I, .codespellignore]
    exclude: >
      (?x)^(
          tests/data/basic_contact/ds.dat|
          uv.lock|
          tests/data/nr_residual/solve.out|
          oss/dependencies.json|
          oss/legal_notices.txt
      )$


- repo: https://github.com/ansys/pre-commit-hooks
  # Not using newer versions because they require 
  # having a LICENSE file in the root directory.
  # For internal repos we don't usually have a LICENSE file. 
  rev: v0.2.9
  hooks:
  - id: add-license-headers
    files: '(ansys)/.*\.(py)'
    args:
    - --custom_template=ansys_copyright_only
    - --ignore_license_check
    - --start_year=2026