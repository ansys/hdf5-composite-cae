repos:

- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: 9026c9127e153371d7a78dfcb0c45ae2046a3d10  # frozen: v0.17.6
  hooks:
    # Run the linter.
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format

- repo: https://github.com/codespell-project/codespell
  rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
  hooks:
  - id: codespell
    args: ["--ignore-words", "doc/styles/config/vocabularies/ANSYS/accept.txt"]
    exclude: >
      (?x)^(
          tests/data/basic_contact/ds.dat|
          uv.lock|
          tests/data/nr_residual/solve.out|
          oss/dependencies.json|
          oss/legal_notices.txt
      )$


- repo: https://github.com/ansys/pre-commit-hooks
  rev: 5e97ca56e2fd5940a745fcba5b1fa6569198267f  # frozen: v0.8.3
  hooks:
    - id: add-license-headers
      files: '(src/ansys|tests)/.*\.(py)'
      args:
      - --start_year=2026
      - --custom_license=Apache-2.0

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
    - id: check-merge-conflict
    - id: debug-statements
    - id: check-yaml
    - id: trailing-whitespace