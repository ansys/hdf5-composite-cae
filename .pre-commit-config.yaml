repos:

- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.11.13
  hooks:
    # Run the linter.
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format

- repo: https://github.com/codespell-project/codespell
  rev: v2.4.1
  hooks:
  - id: codespell
    args: ["--ignore-words", "doc/styles/config/vocabularies/ANSYS/accept.txt"]
    exclude: >
      (?x)^(
          tests/data/basic_contact/ds.dat|
          uv.lock|
          tests/data/nr_residual/solve.out|
          oss/dependencies.json|
          oss/legal_notices.txt
      )$


- repo: https://github.com/ansys/pre-commit-hooks
  rev: v0.7.2
  hooks:
    - id: add-license-headers
      files: '(src/ansys|tests)/.*\.(py)'
      args:
      - --start_year=2026

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: check-merge-conflict
    - id: debug-statements
    - id: check-yaml
    - id: trailing-whitespace